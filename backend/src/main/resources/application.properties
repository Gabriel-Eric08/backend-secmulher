spring.application.name=demo

# Carrega o .env da raiz do projeto (se existir) como propriedades
spring.config.import=optional:file:.env[.properties]

# Banco de dados (a senha vem da variável de ambiente DB_PASSWORD; não versionar)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/omnibase}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# O schema é mantido pelo init.sql; o Hibernate só confere se as entidades batem com ele
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Upload de documentos
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Pasta onde os documentos são guardados (FileStorage local)
storage.local.base-path=${STORAGE_PATH:./storage}

# JWT: segredo com pelo menos 32 caracteres (sem ele, uma chave aleatória é gerada a cada início)
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration=${JWT_EXPIRATION:8h}

# Primeiro administrador, criado só quando o banco não tem nenhum usuário
app.bootstrap.admin-name=${ADMIN_NAME:Administrador}
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}

# Senha dos usuários de demonstração criados pelo profile "seed"
app.seed.password=${SEED_PASSWORD:Demo@2026}

# Origens do front autorizadas (separadas por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Emendas: vence em até N dias -> prazo "NEAR" (alerta de vigência do Termo de Fomento)
app.amendments.deadline-alert-days=${AMENDMENTS_DEADLINE_ALERT_DAYS:30}
